name = "revolt-pass"
main = "src/worker/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Servir frontend estático compilado por Vite
[assets]
directory = "./dist"
binding = "ASSETS"

# Base de datos relacional serverless Cloudflare D1
[[d1_databases]]
binding = "DB"
database_name = "revolt-pass-db"
database_id = "revolt-pass-db" # ID a sincronizar con wrangler d1 create revolt-pass-db

# Variables de entorno públicas
[vars]
ENVIRONMENT = "production"
APP_NAME = "Revolt Pass"
APP_DOMAIN = "https://pass.revoltgroup.com.ar"
